[project]
name = "ai-code-insights-api"
version = "0.1.0"
description = "FastAPI backend for Kilo Code AI code insights"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "pymysql>=1.1.1",
    "sqlalchemy>=2.0.35",
    "uvicorn>=0.30.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "testcontainers[mysql]>=4.9.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
